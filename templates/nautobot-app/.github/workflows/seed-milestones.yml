name: seed-milestones

# Turns {{PROJECT_NAME}}'s own approved design doc into GitHub milestones and claude-go-labeled
# issues. Runs with THIS repo's own secrets, not the factory's -- the factory's own automation
# never reaches into another repo (see its DESIGN.md, "GH_PAT: token strategy"). The design doc
# lives in the factory repo's docs/proposals/<repo-name>.md; fetched over an unauthenticated
# public raw request, since the factory repo is public and no cross-repo credential should be
# needed just to read it.
#
# {{FACTORY_REPO}} is the factory repo's own "owner/name" slug (e.g. someone/ai-app-factory-v2)
# -- set once by factory-new.sh at provisioning time. It has to be a placeholder, not a
# hardcoded name, since a fork or a rename of the factory repo itself must not silently break
# every project it already provisioned.
#
# Human-triggered only, once, via workflow_dispatch with no inputs -- nothing here runs
# automatically. That's deliberate: it's the second of two approval gates (after merging the
# design-doc PR in the factory repo) between "someone had an idea" and "tokens start getting
# spent building it" -- see the factory repo's docs/adr/0001-design-to-issues-loop.md.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the approved design doc from the factory repo
        id: doc
        run: |
          set -euo pipefail
          slug="${{ github.event.repository.name }}"
          url="https://raw.githubusercontent.com/{{FACTORY_REPO}}/main/docs/proposals/${slug}.md"
          content=$(curl -fsSL "$url") || {
            echo "seed-milestones: could not fetch $url" >&2
            echo "Has the design doc PR for this project been merged in {{FACTORY_REPO}}, and does its filename match this repo's name ('${slug}.md')?" >&2
            exit 1
          }
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "content<<$delim"
            printf '%s\n' "$content"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Record start time
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          # Same subscription-auth rationale as every other workflow in this repo:
          # claude_code_oauth_token, not anthropic_api_key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          track_progress: false
          base_branch: "{{BASE_BRANCH}}"
          prompt: |
            Seed this repository's milestones and issues from its own approved design doc.

            ## Design doc ({{FACTORY_REPO}}'s docs/proposals/${{ github.event.repository.name }}.md)

            ${{ steps.doc.outputs.content }}

            ## Instructions

            You are running unattended. Nobody can approve a tool call or answer a
            question mid-run, so asking will simply end the run with nothing done. Work
            from what's given above.

            1. Find the doc's "## Milestones" section -- a bulleted list, one bullet per
               milestone (e.g. "- **M0 — Bootstrap.** ..."). Create one GitHub milestone
               per bullet in THIS repo (`gh api repos/${{ github.repository }}/milestones
               -f title=... -f description=...`), titled `"M<n>: <short title>"` matching
               the bullet's own bold lead-in, with the rest of the bullet's text as the
               description. Skip any milestone whose title already exists (idempotent
               re-run -- this workflow can be fired more than once, e.g. after editing the
               design doc).

            2. For each milestone, create one or more issues in THIS repo
               (`gh issue create`) with a short, concrete acceptance-criteria checklist in
               the body -- follow this repo's own CLAUDE.md (read it first) for
               conventions and definition of done, and match its level of detail and
               phrasing. Apply the `claude-go` label (already present in this repo from
               its template) to issues that are concrete and unambiguous enough for the
               unattended pipeline to attempt; leave design-heavy or genuinely ambiguous
               issues unlabeled or `lane:manual` instead -- do not label everything
               `claude-go` by default. Attach each issue to its milestone with
               `--milestone "M<n>: <short title>"`. Skip creating an issue that already
               exists with the same title (idempotent re-run).

            3. This is the only run of this workflow expected under normal use -- once
               finished, THIS repo's own `claude.yml` picks up whichever issues were
               labeled `claude-go` above and starts implementing them unattended, with no
               further action needed here.

            There is no "Closes #N" line to add -- this isn't implementing an issue, it's
            creating them.
          claude_args: >-
            --model claude-sonnet-5
            --max-turns 150
            --allowedTools "Bash(gh:*),Read,Glob,Grep"

      - name: Upload execution transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-seed-milestones-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          if-no-files-found: warn
          retention-days: 90

      - name: Append journal entry
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: seed-milestones
          ISSUE_TITLE: "Seed milestones and issues from the approved design doc"
          WORKFLOW_NAME: seed-milestones.yml
          MODEL: claude-sonnet-5
          RESULT: ${{ steps.claude.outcome }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          START: ${{ steps.timer.outputs.start }}
        run: |
          export MILESTONE="—"
          export PR_REF="—"
          bash .github/scripts/journal-entry.sh
