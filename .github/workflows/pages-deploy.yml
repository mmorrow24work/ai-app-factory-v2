name: Deploy site to GitHub Pages

# Builds the static SvelteKit output in site/ (adapter-static, see
# site/svelte.config.js) and publishes it to GitHub Pages on every push to
# main that touches the site itself, projects.json (the sidebar's data
# source), or this workflow file.
#
# Requires Repo Settings -> Pages -> Build and deployment -> Source to be
# set to "GitHub Actions" (not the branch-based default) -- see README.md's
# "Setup" section and DESIGN.md's "Lessons carried forward" for why this
# step, done out of order, previously produced a workflow that ran green
# forever while publishing nothing anyone could see.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "projects.json"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
